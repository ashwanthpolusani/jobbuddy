name: Job Scraper & Stage 2 Pipeline

on:
  schedule:
    # Runs at 08:30 IST (03:00 UTC) every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual run

jobs:
  scrape-and-store:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        chunk: [0, 1, 2, 3]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage 1 Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          TOTAL_CHUNKS: 4
        run: |
          cd scraper
          python main.py

  deep-match:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: scrape-and-store
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          cd scraper
          playwright install chromium

      - name: Run Stage 2 Deep Matcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          cd scraper
          python stage2.py
