<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobBuddy — Entry-Level Tech Jobs, Daily</title>
    <meta name="description"
        content="JobBuddy scrapes 150+ company career pages every day and surfaces only genuine entry-level and fresher tech roles. No experience required.">
    <meta property="og:title" content="JobBuddy — Entry-Level Tech Jobs, Daily">
    <meta property="og:description" content="150+ company career pages scraped daily. Only genuine 0-experience tech roles.">
    <meta property="og:url" content="https://buddyjob.netlify.app/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <!-- Google AdSense — replace ca-pub-XXXXXXXXXXXXXXXXX with your publisher ID when approved -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXXX"
        crossorigin="anonymous"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #09090f;
            --surface: #0f0f18;
            --surface2: #151520;
            --surface3: #1c1c2a;
            --border: #1f1f30;
            --border2: #292940;
            --accent: #3b82f6;
            --accent-dim: rgba(59, 130, 246, 0.12);
            --accent-border: rgba(59, 130, 246, 0.28);
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, 0.10);
            --green-border: rgba(34, 197, 94, 0.28);
            --amber: #f59e0b;
            --amber-dim: rgba(245, 158, 11, 0.10);
            --amber-border: rgba(245, 158, 11, 0.28);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.10);
            --text: #e2e2f0;
            --text2: #a0a0c0;
            --muted: #606080;
            --muted2: #7878a0;
            --radius: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Kill Netlify badge */
        a[href*="netlify.com"][style*="fixed"],
        [data-netlify-deploy-id],
        #nl-badge-frame {
            display: none !important;
        }

        /* ── LAYOUT ───────────────────────────────────────────────── */
        .page-wrap {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content-area {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 32px;
            align-items: start;
        }

        .main-col { min-width: 0; }

        .sidebar-col {
            padding-top: 24px;
            position: sticky;
            top: 76px;
        }

        /* ── HEADER ───────────────────────────────────────────────── */
        .header {
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 9, 15, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 60px;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }

        .wordmark {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .wordmark .accent { color: var(--accent); }

        .header-sub {
            font-size: 0.67rem;
            color: var(--muted2);
            margin-top: 2px;
        }

        /* ── PANEL ────────────────────────────────────────────────── */
        .panel-main { padding: 20px 0 80px; }

        /* ── CATEGORY TABS ────────────────────────────────────────── */
        .cat-scroll-wrap {
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 16px 0 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .cat-scroll-wrap::-webkit-scrollbar { display: none; }

        .cat-tabs {
            display: flex;
            gap: 2px;
            white-space: nowrap;
            min-width: max-content;
        }

        .cat-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            color: var(--muted2);
            font-size: 0.79rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
        }

        .cat-btn:hover {
            color: var(--text);
            background: var(--surface2);
        }

        .cat-btn.active {
            background: var(--accent-dim);
            color: #93c5fd;
            font-weight: 600;
        }

        .cat-btn .count {
            margin-left: 5px;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .cat-btn.active .count { color: rgba(147, 197, 253, 0.55); }

        /* ── FILTERS ──────────────────────────────────────────────── */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-wrap {
            position: relative;
            width: 100%;
        }

        .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 0.84rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .search-input:focus {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.07);
        }

        .search-input::placeholder { color: var(--muted); }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-label {
            font-size: 0.63rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-right: 2px;
            user-select: none;
            white-space: nowrap;
        }

        .filter-divider {
            width: 1px;
            height: 18px;
            background: var(--border2);
            margin: 0 4px;
            flex-shrink: 0;
            align-self: center;
        }

        /* Filter buttons — rectangular, not pill-shaped */
        .filt-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border-radius: var(--radius);
            font-size: 0.74rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--muted2);
            transition: all 0.13s;
            white-space: nowrap;
            line-height: 1;
        }

        .filt-btn:hover {
            color: var(--text);
            background: var(--surface3);
            border-color: var(--muted);
        }

        .filt-btn.active-green {
            background: var(--green-dim);
            border-color: var(--green-border);
            color: var(--green);
            font-weight: 600;
        }

        .filt-btn.active-amber {
            background: var(--amber-dim);
            border-color: var(--amber-border);
            color: var(--amber);
            font-weight: 600;
        }

        .filt-btn.active-blue {
            background: var(--accent-dim);
            border-color: var(--accent-border);
            color: #93c5fd;
            font-weight: 600;
        }

        /* ── RESULT META ──────────────────────────────────────────── */
        .result-count {
            font-size: 0.72rem;
            color: var(--muted);
            padding: 8px 0 4px;
        }

        /* ── SECTION LABEL ────────────────────────────────────────── */
        .section-label {
            font-size: 0.63rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 20px 0 8px;
        }

        /* ── JOB CARD ─────────────────────────────────────────────── */
        .job-card {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 14px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s, padding 0.12s, margin 0.12s, border-color 0.12s;
        }

        .job-card:hover {
            background: rgba(59, 130, 246, 0.025);
            margin: 0 -14px;
            padding: 15px 14px;
            border-radius: 10px;
            border-bottom-color: transparent;
        }

        .job-left { min-width: 0; }

        .job-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .job-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
        }

        .tag-new {
            font-size: 0.57rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 4px;
            padding: 1px 5px;
            flex-shrink: 0;
            animation: pnew 2.5s ease-in-out infinite;
        }

        @keyframes pnew {
            0%, 100% { opacity: 1 }
            50% { opacity: .4 }
        }

        .job-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .job-company {
            font-size: 0.77rem;
            font-weight: 600;
            color: var(--text2);
        }

        .meta-sep {
            color: var(--border2);
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .job-loc {
            font-size: 0.73rem;
            color: var(--muted2);
        }

        .job-cat {
            font-size: 0.70rem;
            color: var(--muted);
        }

        .job-reason {
            font-size: 0.71rem;
            color: var(--muted2);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
        }

        .job-reason.expanded {
            display: block;
            -webkit-line-clamp: unset;
        }

        .expand-btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-top: 3px;
            font-size: 0.67rem;
            color: var(--muted);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.14s;
        }

        .expand-btn:hover { color: var(--text2); }

        .job-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            padding-top: 1px;
        }

        .job-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
        }

        .badge {
            font-size: 0.67rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 4px;
        }

        .badge-confirmed {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid var(--green-border);
        }

        .badge-likely {
            background: var(--amber-dim);
            color: var(--amber);
            border: 1px solid var(--amber-border);
        }

        .apply-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border-radius: var(--radius);
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .apply-btn.direct-btn {
            background: var(--accent);
            color: #fff;
        }

        .apply-btn.direct-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .apply-btn.browse-btn {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--muted2);
        }

        .apply-btn.browse-btn:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        /* ── SIDEBAR ──────────────────────────────────────────────── */
        .sidebar-ad-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .sidebar-ad-label {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
            text-align: center;
            padding: 6px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-ad-slot {
            display: block;
            min-height: 250px;
            width: 100%;
        }

        /* ── STATES ───────────────────────────────────────────────── */
        .state {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .state p {
            color: var(--muted);
            font-size: 0.87rem;
        }

        /* ── FOOTER ───────────────────────────────────────────────── */
        .footer {
            border-top: 1px solid var(--border);
            padding: 20px 24px;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-copy {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            font-size: 0.72rem;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s;
        }

        .footer-links a:hover { color: var(--text2); }

        /* ── MOBILE ───────────────────────────────────────────────── */
        @media (max-width: 880px) {
            .content-area {
                grid-template-columns: 1fr;
                padding: 0 16px;
            }

            .sidebar-col { display: none; }

            .header { padding: 0 16px; }
        }

        @media (max-width: 600px) {
            .job-card { flex-direction: column; }

            .job-left { width: 100%; }

            .job-right {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding-left: 0;
            }

            .job-badges { flex-wrap: nowrap; }

            .filter-label { display: none; }

            .footer-inner {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        @media (max-width: 400px) {
            .job-title { white-space: normal; }
        }
    </style>
</head>

<body>
<div class="page-wrap">

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <a class="brand-block" href="/" aria-label="JobBuddy home">
                <!-- Clean SVG shield mark — no emoji, no AI image -->
                <svg class="brand-logo" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="34" height="34" rx="9" fill="#1a2d4a"/>
                    <path d="M17 5.5L7 10.5V17C7 22.8 11.5 28.2 17 29.5C22.5 28.2 27 22.8 27 17V10.5L17 5.5Z"
                          fill="#3b82f6" opacity="0.18"/>
                    <path d="M17 7.5L9 12V17C9 21.8 12.8 26.2 17 27.5C21.2 26.2 25 21.8 25 17V12L17 7.5Z"
                          stroke="#3b82f6" stroke-width="1.5" fill="none"/>
                    <path d="M13 17L15.5 19.5L21 14"
                          stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div>
                    <div class="wordmark">Job<span class="accent">Buddy</span></div>
                    <div class="header-sub">Daily tech jobs for freshers &middot; No experience required</div>
                </div>
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="content-area">

        <!-- JOB LIST COLUMN -->
        <main class="main-col" id="panel-jobs">
            <div class="panel-main">

                <!-- Category tabs -->
                <div class="cat-scroll-wrap">
                    <div class="cat-tabs" id="cat-tabs">
                        <button class="cat-btn active" data-cat="all" id="cat-all" onclick="setCat('all',this)">All</button>
                        <button class="cat-btn" data-cat="software_engineering" id="cat-swe" onclick="setCat('software_engineering',this)">Software Eng</button>
                        <button class="cat-btn" data-cat="data_ml" id="cat-dataml" onclick="setCat('data_ml',this)">Data / ML</button>
                        <button class="cat-btn" data-cat="devops_cloud" id="cat-devops" onclick="setCat('devops_cloud',this)">DevOps</button>
                        <button class="cat-btn" data-cat="cybersecurity" id="cat-cyber" onclick="setCat('cybersecurity',this)">Security</button>
                        <button class="cat-btn" data-cat="early_careers" id="cat-early" onclick="setCat('early_careers',this)">Early Careers</button>
                        <button class="cat-btn" data-cat="product_design" id="cat-product" onclick="setCat('product_design',this)">Product</button>
                        <button class="cat-btn" data-cat="other" id="cat-other" onclick="setCat('other',this)">Other</button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-section">
                    <div class="search-wrap">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                        </svg>
                        <input class="search-input" id="search-input" type="text"
                            placeholder="Search title, company, location&#8230;" oninput="debounceSearch()"
                            autocomplete="off" aria-label="Search jobs">
                    </div>

                    <div class="filter-row">
                        <span class="filter-label">Location</span>
                        <button class="filt-btn active-blue" id="loc-all" onclick="setLoc('all',this)">All</button>
                        <button class="filt-btn" id="loc-remote" onclick="setLoc('remote',this)">Remote</button>
                        <button class="filt-btn" id="loc-india" onclick="setLoc('india',this)">India</button>
                        <button class="filt-btn" id="loc-global" onclick="setLoc('global',this)">Global</button>

                        <div class="filter-divider" aria-hidden="true"></div>
                        
                        <label style="display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text);cursor:pointer;user-select:none;">
                            <input type="checkbox" id="direct-apply-chk" onchange="toggleDirectApply()" style="accent-color:var(--accent);width:14px;height:14px;cursor:pointer;">
                            Direct Apply Only
                        </label>
                    </div>
                </div>

                <div class="result-count" id="result-count" aria-live="polite"></div>
                <div id="jobs-container">
                    <div class="state">
                        <div class="spinner" role="status" aria-label="Loading"></div>
                        <p>Loading job listings&#8230;</p>
                    </div>
                </div>

            </div>
        </main>

        <!-- SIDEBAR — AdSense (hidden on mobile via CSS) -->
        <aside class="sidebar-col" aria-label="Sponsored content">
            <div class="sidebar-ad-wrap">
                <div class="sidebar-ad-label">Sponsored</div>
                <!-- Google AdSense 300x250 — replace data-ad-client and data-ad-slot with your real values -->
                <ins class="adsbygoogle sidebar-ad-slot"
                    data-ad-client="ca-pub-XXXXXXXXXXXXXXXXX"
                    data-ad-slot="XXXXXXXXXX"
                    data-ad-format="rectangle"
                    data-full-width-responsive="false"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </aside>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-copy">&copy; 2025 JobBuddy. All rights reserved.</span>
            <nav class="footer-links" aria-label="Legal links">
                <a href="/privacy.html">Privacy Policy</a>
                <a href="/terms.html">Terms of Use</a>
            </nav>
        </div>
    </footer>

</div>

<script>
    // State
    let allJobs = [];
    let activeCat = 'all';
    let activeType = 'all';
    let activeLoc = 'all';
    let cardIdx = 0;
    let isLoading = true;

    let CURRENT_CACHE_KEY = 'jb_jobs_v3';
    const CACHE_TTL = 10 * 60 * 1000; // 10 minutes

    // Category
    function setCat(cat, btn) {
        activeCat = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        fetchJobs(false);
    }

    function toggleDirectApply() {
        activeType = document.getElementById('direct-apply-chk').checked ? 'direct_apply' : 'all';
        fetchJobs(false);
    }

    // Location filter
    function setLoc(val, btn) {
        activeLoc = val;
        ['loc-all', 'loc-remote', 'loc-india', 'loc-global'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.className = 'filt-btn';
        });
        btn.className = 'filt-btn active-blue';
        fetchJobs(false);
    }

    // Helpers
    function isNew(d) { return d && (Date.now() - new Date(d).getTime()) < 48 * 3600 * 1000; }
    function esc(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function ltOf(j) { return j.link_type || 'direct_apply'; }

    // Render
    function renderJobs() {
        if (isLoading && allJobs.length === 0) return;

        const countEl = document.getElementById('result-count');
        countEl.textContent = 'Showing the latest listings matching your search';

        const cnt = document.getElementById('jobs-container');
        if (!allJobs.length) {
            cnt.innerHTML = '<div class="state"><p>No jobs match these filters.</p></div>';
            return;
        }
        cardIdx = 0;
        const direct = allJobs.filter(j => ltOf(j) === 'direct_apply');
        const browsable = allJobs.filter(j => ltOf(j) !== 'direct_apply');
        let html = '';
        if (direct.length)
            html += '<div class="section-label">Direct Apply</div>'
                  + direct.map(buildCard).join('');
        if (browsable.length && activeType !== 'direct_apply')
            html += '<div class="section-label" style="margin-top:' + (direct.length ? '8px' : '0') + '">Browse Lists</div>'
                  + browsable.map(buildCard).join('');
        cnt.innerHTML = html;
    }

    // Build a job card
    function buildCard(job) {
        const id = 'c' + (cardIdx++);
        const isDirect = ltOf(job) === 'direct_apply';
        const verdict = job.experience_verdict || null;
        const newTag = isNew(job.scraped_at) ? '<span class="tag-new">New</span>' : '';
        // why_entry_level: factual note on WHY this qualifies as 0-exp (not skills matching)
        const reason = job.why_entry_level || job.match_reasoning || job.match_reason || '';
        const cat = (job.category || 'other').replace(/_/g, ' ');

        let vbadge = '';
        if (verdict === 'SAFE') vbadge = '<span class="badge badge-confirmed">Confirmed</span>';
        else if (verdict === 'POSSIBLE') vbadge = '<span class="badge badge-likely">Likely</span>';

        // No match_score badge — score was personal-skill-based, which we no longer do

        const reasonHtml = reason
            ? '<div class="job-reason" id="r' + id + '">' + esc(reason) + '</div>'
              + '<button class="expand-btn" id="b' + id + '" onclick="toggle(\'' + id + '\')">'
              + '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg> why entry-level</button>'
            : '';

        const applyBtn = isDirect
            ? '<a href="' + esc(job.link || '#') + '" class="apply-btn direct-btn" target="_blank" rel="noopener noreferrer">Apply &#8594;</a>'
            : '<a href="' + esc(job.link || '#') + '" class="apply-btn browse-btn" target="_blank" rel="noopener noreferrer">Browse &#8594;</a>';

        return '<div class="job-card">'
            + '<div class="job-left">'
            + '<div class="job-title-row"><div class="job-title">' + esc(job.title || 'Untitled') + '</div>' + newTag + '</div>'
            + '<div class="job-meta">'
            + (job.company_name ? '<span class="job-company">' + esc(job.company_name) + '</span>' : '')
            + (job.company_name && job.location ? '<span class="meta-sep">/</span>' : '')
            + (job.location ? '<span class="job-loc">' + esc(job.location) + '</span>' : '')
            + (cat ? '<span class="meta-sep">&middot;</span><span class="job-cat">' + esc(cat) + '</span>' : '')
            + '</div>'
            + reasonHtml
            + '</div>'
            + '<div class="job-right">'
            + '<div class="job-badges">' + vbadge + '</div>'
            + applyBtn
            + '</div>'
            + '</div>';
    }

    function toggle(id) {
        const r = document.getElementById('r' + id);
        const b = document.getElementById('b' + id);
        if (!r) return;
        const ex = r.classList.toggle('expanded');
        b.innerHTML = ex
            ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg> less'
            : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg> why entry-level';
    }

    // Cache
    function saveCache(jobs) {
        try { localStorage.setItem(CURRENT_CACHE_KEY, JSON.stringify({ ts: Date.now(), jobs })); } catch (e) {}
    }
    function loadCache() {
        try {
            const raw = localStorage.getItem(CURRENT_CACHE_KEY);
            if (!raw) return null;
            const { ts, jobs } = JSON.parse(raw);
            if (Date.now() - ts > CACHE_TTL) return null;
            return jobs;
        } catch (e) { return null; }
    }

    // Background sync indicator
    function setSyncing(on) {
        let dot = document.getElementById('sync-dot');
        if (on && !dot) {
            dot = document.createElement('span');
            dot.id = 'sync-dot';
            dot.title = 'Refreshing\u2026';
            dot.style.cssText = 'display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle;animation:pnew 1.2s ease-in-out infinite;';
            const sub = document.querySelector('.header-sub');
            if (sub) sub.appendChild(dot);
        } else if (!on && dot) {
            dot.remove();
        }
    }

    // Search debounce
    let searchTimer = null;
    function debounceSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => fetchJobs(false), 280);
    }

    // Fetch jobs from API
    let offset = 0;
    let lastScrapedAt = null;
    let lastId = null;
    const PAGE = 200;

    async function fetchJobs(append) {
        append = !!append;
        cardIdx = 0;

        if (!append) {
            offset = 0;
            lastScrapedAt = null;
            lastId = null;
            const cached = loadCache();
            if (cached && cached.length) {
                allJobs = cached;
                isLoading = false;
                renderJobs();
                setSyncing(true);
            } else {
                isLoading = true;
                document.getElementById('jobs-container').innerHTML =
                    '<div class="state"><div class="spinner" role="status" aria-label="Loading"></div><p>Fetching listings&#8230;</p></div>';
            }
        }

        try {
            const url = `/.netlify/functions/getJobs?limit=${PAGE}&skip=${offset}&last_scraped_at=${encodeURIComponent(lastScrapedAt || "")}&last_id=${lastId || ""}&category=${activeCat === "all" ? "" : activeCat}&link_type=${activeType === "all" ? "" : activeType}&location=${activeLoc}&search=${encodeURIComponent(document.getElementById("search-input").value || "")}`;
            CURRENT_CACHE_KEY = "jb_jobs_" + btoa(url);
            const res = await fetch(url);
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error(data.error || 'Bad response from server');
            if (!data.length && !append) {
                setSyncing(false);
                if (allJobs.length === 0) {
                    document.getElementById('jobs-container').innerHTML =
                        '<div class="state"><p>No listings yet. Scraper may still be running.</p></div>';
                }
                return;
            }
            allJobs = append ? allJobs.concat(data) : data;
            if (data.length > 0) {
                const lastJob = data[data.length - 1];
                lastScrapedAt = lastJob.scraped_at;
                lastId = lastJob._id;
            }
            offset += data.length;
            isLoading = false;
            if (!append) saveCache(allJobs);
            setSyncing(false);
            renderJobs();
            const ex = document.getElementById('lmb');
            if (ex) ex.remove();
            if (data.length === PAGE) {
                const d = document.createElement('div');
                d.style.cssText = 'text-align:center;margin-top:28px;';
                d.id = 'lmb';
                d.innerHTML = '<button onclick="fetchJobs(true)" style="padding:8px 24px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--muted2);font-family:inherit;font-size:0.8rem;font-weight:600;cursor:pointer;">Load more</button>';
                document.getElementById('jobs-container').appendChild(d);
            }
        } catch (e) {
            setSyncing(false);
            isLoading = false;
            const msg = e.message || 'Unknown error';
            if (allJobs.length === 0) {
                document.getElementById('jobs-container').innerHTML =
                    '<div class="state">'
                    + '<p style="color:var(--red);margin-bottom:14px">' + msg + '</p>'
                    + '<button onclick="fetchJobs(false)" style="padding:8px 22px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:inherit;font-size:0.82rem;font-weight:600;cursor:pointer;">Retry</button>'
                    + '</div>';
            }
        }
    }

    // Suppress Netlify badge
    function hideNBadge() {
        document.querySelectorAll('a[href*="netlify.com"], #nl-badge-frame').forEach(el => {
            el.style.setProperty('display', 'none', 'important');
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchJobs(false);
        setTimeout(hideNBadge, 500);
        setTimeout(hideNBadge, 2000);
        setTimeout(hideNBadge, 5000);
    });
</script>
</body>
</html>
