<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobBuddy — Daily Job Feed for Ashwanth</title>
    <meta name="description" content="Personalized job matches scraped daily from 150+ company career pages, filtered for a CS fresher in Hyderabad.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg:        #0d0d0f;
        --surface:   #141416;
        --surface2:  #1a1a1d;
        --border:    #232328;
        --border2:   #2e2e34;
        --accent:    #e8603f;
        --accent-dim:#c44e2e;
        --green:     #22c55e;
        --yellow:    #eab308;
        --red:       #ef4444;
        --text:      #f0f0f2;
        --muted:     #52525b;
        --muted2:    #a1a1aa;
    }

    html { scroll-behavior: smooth; }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
    }

    /* ── HEADER ─────────────────────────────────────────────────────── */
    .header {
        border-bottom: 1px solid var(--border);
        padding: 28px 40px 0;
    }
    .header-inner {
        max-width: 1100px;
        margin: 0 auto;
    }
    .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }
    .wordmark {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.02em;
    }
    .wordmark span { color: var(--accent); }
    .header-sub {
        font-size: 0.8rem;
        color: var(--muted2);
        margin-top: 2px;
    }
    .header-stats {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
    }
    .hstat {
        text-align: right;
    }
    .hstat-val {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1;
    }
    .hstat-lbl {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    /* ── TOP NAV ─────────────────────────────────────────────────────── */
    .top-nav {
        display: flex;
        gap: 0;
    }
    .nav-btn {
        padding: 10px 20px;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--muted2);
        font-size: 0.83rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
        margin-bottom: -1px;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active {
        color: var(--text);
        border-bottom-color: var(--accent);
        font-weight: 600;
    }

    /* ── PANEL ───────────────────────────────────────────────────────── */
    #panel-jobs  { display: block; }
    #panel-stats { display: none; }

    .panel {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 40px 80px;
    }

    /* ── FILTER BAR ─────────────────────────────────────────────────── */
    .filter-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 0;
    }
    .search-wrap {
        flex: 1;
        min-width: 200px;
        position: relative;
    }
    .search-wrap svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
    }
    .search-input {
        width: 100%;
        padding: 8px 12px 8px 32px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        font-size: 0.83rem;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--border2); }
    .search-input::placeholder { color: var(--muted); }

    .filter-select {
        padding: 8px 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--muted2);
        font-size: 0.83rem;
        font-family: inherit;
        outline: none;
        cursor: pointer;
    }
    .filter-select:focus { border-color: var(--border2); }

    /* ── CATEGORY TABS ───────────────────────────────────────────────── */
    .cat-tabs {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }
    .cat-btn {
        padding: 5px 13px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 5px;
        color: var(--muted2);
        font-size: 0.78rem;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.12s;
        white-space: nowrap;
    }
    .cat-btn:hover { color: var(--text); background: var(--surface2); }
    .cat-btn.active {
        background: var(--surface2);
        border-color: var(--border2);
        color: var(--text);
        font-weight: 600;
    }
    .cat-btn .count {
        margin-left: 5px;
        color: var(--muted);
        font-size: 0.72rem;
    }
    .cat-btn.active .count { color: var(--muted2); }

    /* ── RESULT META ─────────────────────────────────────────────────── */
    .result-count {
        font-size: 0.75rem;
        color: var(--muted);
        padding: 10px 0 6px;
    }

    /* ── SECTION LABEL ───────────────────────────────────────────────── */
    .section-label {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 18px 0 8px;
    }

    /* ── LOGO AVATAR ──────────────────────────────────────────────────── */
    .logo-avatar {
        width: 36px; height: 36px;
        border-radius: 8px;
        background: var(--surface2);
        border: 1px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--muted2);
        flex-shrink: 0;
        overflow: hidden;
    }
    .logo-avatar img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

    /* ── ATS BADGE ───────────────────────────────────────────────────── */
    .ats-badge {
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 1px 6px;
        border-radius: 3px;
        flex-shrink: 0;
    }
    .ats-greenhouse { background: rgba(0,200,100,0.1);  color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
    .ats-lever      { background: rgba(99,102,241,0.1); color: #818cf8; border: 1px solid rgba(99,102,241,0.2); }
    .ats-ashby      { background: rgba(236,72,153,0.1); color: #f472b6; border: 1px solid rgba(236,72,153,0.2); }
    .ats-workday    { background: rgba(251,146,60,0.1); color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }
    .ats-other      { background: rgba(100,116,139,0.1);color: #94a3b8; border: 1px solid rgba(100,116,139,0.2); }

    /* ── JOB ROW (updated layout) ────────────────────────────────────── */
    .job-card {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
        transition: background 0.12s;
        cursor: default;
    }
    .job-card:hover { background: rgba(255,255,255,0.015); margin: 0 -12px; padding: 14px 12px; border-radius: 8px; border-bottom-color: transparent; }
    .job-left { min-width: 0; }
    .job-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 4px;
    }
    .job-title {
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.3;
    }
    .tag-new {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        border: 1px solid var(--accent-dim);
        border-radius: 3px;
        padding: 1px 5px;
        flex-shrink: 0;
        animation: pulse-new 2s ease-in-out infinite;
    }
    @keyframes pulse-new {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .job-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .job-company { font-size: 0.8rem; font-weight: 600; color: var(--muted2); }
    .meta-sep { color: var(--border2); font-size: 0.75rem; }
    .job-loc, .job-cat { font-size: 0.76rem; color: var(--muted); }
    .job-reason {
        margin-top: 5px;
        font-size: 0.74rem;
        color: var(--muted);
        line-height: 1.5;
        max-width: 680px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .job-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .quality-dots { display: flex; gap: 3px; align-items: center; }
    .qdot { width: 5px; height: 5px; border-radius: 50%; background: var(--border2); }
    .qdot.filled { background: var(--accent); }
    .apply-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 16px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        font-family: inherit;
        text-decoration: none;
        transition: opacity 0.15s;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .apply-btn.direct-btn { background: var(--accent); color: #fff; }
    .apply-btn.direct-btn:hover { opacity: 0.88; }
    .apply-btn.browse-btn {
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--muted2);
    }
    .apply-btn.browse-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── STATS PANEL ─────────────────────────────────────────────────── */
    .stats-summary {
        display: flex;
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 24px;
    }
    .stat-box {
        flex: 1;
        background: var(--surface);
        padding: 16px 20px;
        min-width: 0;
    }
    .stat-box .val {
        font-size: 1.6rem;
        font-weight: 800;
        line-height: 1;
        color: var(--text);
        margin-bottom: 3px;
    }
    .stat-box .lbl { font-size: 0.72rem; color: var(--muted2); }

    .site-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .site-table th {
        text-align: left;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
    }
    .site-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
        color: var(--muted2);
    }
    .site-table tr:last-child td { border-bottom: none; }
    .site-table tr:hover td { background: rgba(255,255,255,0.015); }

    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.72rem;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 4px;
    }
    .pill-green  { background: rgba(34,197,94,0.1);  color: var(--green); }
    .pill-yellow { background: rgba(234,179,8,0.1);  color: var(--yellow); }
    .pill-red    { background: rgba(239,68,68,0.1);  color: var(--red); }

    .url-cell {
        font-family: 'Courier New', monospace;
        font-size: 0.71rem;
        color: var(--muted2);
        max-width: 260px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ── STATE SCREENS ───────────────────────────────────────────────── */
    .state {
        text-align: center;
        padding: 80px 20px;
    }
    .spinner {
        width: 28px; height: 28px;
        border: 2px solid var(--border2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state p { color: var(--muted); font-size: 0.88rem; }
    .state-icon { font-size: 2rem; margin-bottom: 12px; }

    /* ── RESPONSIVE ──────────────────────────────────────────────────── */
    @media (max-width: 640px) {
        .header { padding: 24px 20px 0; }
        .panel { padding: 16px 20px 60px; }
        .job-card { grid-template-columns: 36px 1fr; }
        .job-right { display: none; }
        .header-stats { display: none; }
        .stats-summary { flex-direction: column; gap: 0; }
        .hstat { text-align: left; }
    }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="header-inner">
        <div class="header-top">
            <div>
                <div class="wordmark">Job<span>Buddy</span></div>
                <div class="header-sub">156+ career pages scraped daily &middot; filtered for CS fresher, Hyderabad</div>
            </div>
            <div class="header-stats" id="header-stats">
                <div class="hstat"><div class="hstat-val">—</div><div class="hstat-lbl">Matches</div></div>
                <div class="hstat"><div class="hstat-val">—</div><div class="hstat-lbl">Direct Apply</div></div>
                <div class="hstat"><div class="hstat-val">—</div><div class="hstat-lbl">Last 48h</div></div>
            </div>
        </div>
        <div class="top-nav">
            <button class="nav-btn active" onclick="switchPanel('jobs', this)">Jobs</button>
            <button class="nav-btn"        onclick="switchPanel('stats', this)">Site Analysis</button>
        </div>
    </div>
</div>

<!-- JOBS PANEL -->
<div id="panel-jobs" class="panel">
    <div class="cat-tabs" id="cat-tabs">
        <button class="cat-btn active" data-cat="all"                  onclick="setCategory('all', this)">All</button>
        <button class="cat-btn"        data-cat="software_engineering" onclick="setCategory('software_engineering', this)">Software Eng</button>
        <button class="cat-btn"        data-cat="data_ml"              onclick="setCategory('data_ml', this)">Data / ML</button>
        <button class="cat-btn"        data-cat="devops_cloud"         onclick="setCategory('devops_cloud', this)">DevOps</button>
        <button class="cat-btn"        data-cat="cybersecurity"        onclick="setCategory('cybersecurity', this)">Security</button>
        <button class="cat-btn"        data-cat="early_careers"        onclick="setCategory('early_careers', this)">Early Careers</button>
        <button class="cat-btn"        data-cat="product_design"       onclick="setCategory('product_design', this)">Product</button>
        <button class="cat-btn"        data-cat="other"                onclick="setCategory('other', this)">Other</button>
    </div>

    <div class="filter-bar">
        <div class="search-wrap">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input class="search-input" id="search-input" type="text" placeholder="Search title, company, location…" oninput="renderJobs()">
        </div>
        <select class="filter-select" id="quality-select" onchange="renderJobs()">
            <option value="0">Any quality</option>
            <option value="3" selected>Quality 3+</option>
            <option value="4">Quality 4+</option>
            <option value="5">Quality 5</option>
        </select>
        <select class="filter-select" id="type-select" onchange="renderJobs()">
            <option value="all">All types</option>
            <option value="direct_apply">Direct Apply</option>
            <option value="filtered_list">Browse Lists</option>
        </select>
    </div>

    <div class="result-count" id="result-count"></div>
    <div id="jobs-container">
        <div class="state"><div class="spinner"></div><p>Loading job matches…</p></div>
    </div>
</div>

<!-- STATS PANEL -->
<div id="panel-stats" class="panel">
    <div id="stats-container">
        <div class="state"><div class="spinner"></div><p>Loading site performance…</p></div>
    </div>
</div>

<!-- SCRIPT -->
<script>
// ── State ──────────────────────────────────────────────────────────────
let allJobs     = [];
let activePanel = 'jobs';
let activeCat   = 'all';
let statsLoaded = false;

// ── Panel switching ────────────────────────────────────────────────────
function switchPanel(panel, btn) {
    activePanel = panel;
    document.getElementById('panel-jobs').style.display   = panel === 'jobs'  ? 'block' : 'none';
    document.getElementById('panel-stats').style.display  = panel === 'stats' ? 'block' : 'none';
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (panel === 'stats' && !statsLoaded) loadSiteStats();
}

// ── Category ───────────────────────────────────────────────────────────
function setCategory(cat, btn) {
    activeCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderJobs();
}

// ── Helpers ────────────────────────────────────────────────────────────
function stars(q) {
    if (!q) return '<span style="color:var(--muted)">—</span>';
    const filled = '★'.repeat(q);
    const empty  = '☆'.repeat(5 - q);
    const colors = ['','#f87171','#fbbf24','#fbbf24','#34d399','#34d399'];
    return `<span class="stars" style="color:${colors[q]}">${filled}${empty}</span>`;
}

function isNew(isoDate) {
    if (!isoDate) return false;
    return (Date.now() - new Date(isoDate).getTime()) < 48 * 3600 * 1000;
}

function esc(s) {
    return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function qualityOfJob(job) {
    // For old-schema docs that have no quality field, default to 3
    return typeof job.quality === 'number' ? job.quality : 3;
}

function linkTypeOfJob(job) {
    return job.link_type || 'direct_apply'; // old docs assumed direct
}

// ── Render Jobs ────────────────────────────────────────────────────────
function renderJobs() {
    const query   = (document.getElementById('search-input').value || '').toLowerCase();
    const minQ    = parseInt(document.getElementById('quality-select').value, 10);
    const typeF   = document.getElementById('type-select').value;

    const filtered = allJobs.filter(job => {
        if (activeCat !== 'all' && job.category !== activeCat) return false;
        if (qualityOfJob(job) < minQ) return false;
        if (typeF !== 'all' && linkTypeOfJob(job) !== typeF) return false;
        if (query) {
            const hay = [job.title, job.company_name, job.location, job.match_reason].join(' ').toLowerCase();
            if (!hay.includes(query)) return false;
        }
        return true;
    });

    // Update result count
    document.getElementById('result-count').textContent =
        `${filtered.length} job${filtered.length !== 1 ? 's' : ''} match your filters`;

    const container = document.getElementById('jobs-container');
    if (filtered.length === 0) {
        container.innerHTML = `<div class="state"><div class="emoji">🔍</div><p>No jobs match these filters.</p></div>`;
        return;
    }

    // Split into direct apply vs browse lists
    const direct   = filtered.filter(j => linkTypeOfJob(j) === 'direct_apply');
    const filtered2 = filtered.filter(j => linkTypeOfJob(j) !== 'direct_apply');

    let html = '';

    if (direct.length > 0) {
        html += `<div class="section-label">Direct Apply &mdash; ${direct.length}</div>`;
        html += direct.map(buildCard).join('');
    }
    if (filtered2.length > 0 && typeF !== 'direct_apply') {
        html += `<div class="section-label" style="margin-top:${direct.length > 0 ? '8px' : '0'}">Browse Lists &mdash; ${filtered2.length}</div>`;
        html += filtered2.map(buildCard).join('');
    }

    container.innerHTML = html;
}

function logoAvatar(company) {
    const initials = (company || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
    // Try Clearbit logo, fallback to colored initials
    const domain = (company || '').toLowerCase().replace(/\s+/g, '') + '.com';
    return `<div class="logo-avatar">
        <img src="https://logo.clearbit.com/${esc(domain)}" alt="" loading="lazy"
             onerror="this.parentElement.textContent='${initials}'">
    </div>`;
}

function atsBadge(ats) {
    if (!ats) return '';
    const cls = ats.toLowerCase().includes('greenhouse') ? 'ats-greenhouse'
              : ats.toLowerCase().includes('lever')      ? 'ats-lever'
              : ats.toLowerCase().includes('ashby')      ? 'ats-ashby'
              : ats.toLowerCase().includes('workday')    ? 'ats-workday'
              : 'ats-other';
    return `<span class="ats-badge ${cls}">${esc(ats)}</span>`;
}

function buildCard(job) {
    const lt       = linkTypeOfJob(job);
    const isDirect = lt === 'direct_apply';
    const q        = qualityOfJob(job);
    const loc      = job.location || '';
    const company  = job.company_name || '';
    const link     = job.link || '#';
    const scraped  = job.scraped_at || '';
    const cat      = (job.category || 'other').replace(/_/g, ' ');
    const ats      = job.ats_name || '';

    const newTag = isNew(scraped) ? '<span class="tag-new">New</span>' : '';

    const qDots = Array.from({length: 5}, (_, i) =>
        `<span class="qdot${i < q ? ' filled' : ''}"></span>`
    ).join('');

    const applyBtn = isDirect
        ? `<a href="${esc(link)}" class="apply-btn direct-btn" target="_blank" rel="noopener noreferrer">Apply &rarr;</a>`
        : `<a href="${esc(link)}" class="apply-btn browse-btn" target="_blank" rel="noopener noreferrer">Browse</a>`;

    const reason = job.match_reason ? `<div class="job-reason">${esc(job.match_reason)}</div>` : '';

    return `
    <div class="job-card">
        ${logoAvatar(company)}
        <div class="job-left">
            <div class="job-title-row">
                <div class="job-title">${esc(job.title || 'Untitled Position')}</div>
                ${newTag}
                ${atsBadge(ats)}
            </div>
            <div class="job-meta">
                ${company ? `<span class="job-company">${esc(company)}</span>` : ''}
                ${company && loc ? '<span class="meta-sep">/</span>' : ''}
                ${loc ? `<span class="job-loc">${esc(loc)}</span>` : ''}
                ${cat ? `<span class="meta-sep">&middot;</span><span class="job-cat">${esc(cat)}</span>` : ''}
            </div>
            ${reason}
        </div>
        <div class="job-right">
            <div class="quality-dots">${qDots}</div>
            ${applyBtn}
        </div>
    </div>`;
}

// ── Update category tab counts ─────────────────────────────────────────
function updateCatCounts() {
    const cats = ['software_engineering','data_ml','devops_cloud','cybersecurity','early_careers','product_design','other'];
    const totalBtn = document.querySelector('[data-cat="all"]');
    if (totalBtn) {
        let countEl = totalBtn.querySelector('.count');
        if (!countEl) { countEl = document.createElement('span'); countEl.className = 'count'; totalBtn.appendChild(countEl); }
        countEl.textContent = allJobs.length;
    }

    cats.forEach(cat => {
        const btn = document.querySelector(`[data-cat="${cat}"]`);
        if (!btn) return;
        const n = allJobs.filter(j => j.category === cat).length;
        let countEl = btn.querySelector('.count');
        if (!countEl) { countEl = document.createElement('span'); countEl.className = 'count'; btn.appendChild(countEl); }
        countEl.textContent = n;
    });

    // Header stats — new format
    const direct = allJobs.filter(j => linkTypeOfJob(j) === 'direct_apply').length;
    const recent = allJobs.filter(j => isNew(j.scraped_at)).length;
    const cells = document.querySelectorAll('#header-stats .hstat-val');
    if (cells.length >= 3) {
        cells[0].textContent = allJobs.length;
        cells[1].textContent = direct;
        cells[2].textContent = recent;
    }
}

// ── Fetch Jobs ─────────────────────────────────────────────────────────
let currentOffset = 0;
const PAGE_SIZE = 200;

async function fetchJobs(append) {
    append = !!append;
    if (!append) {
        currentOffset = 0;
        document.getElementById('jobs-container').innerHTML =
            '<div class="state"><div class="spinner"></div><p>Fetching your personalised job matches…</p></div>';
    }
    try {
        const res = await fetch('/.netlify/functions/getJobs?min_quality=0&limit=' + PAGE_SIZE + '&skip=' + currentOffset);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('Bad response from API');
        if (data.length === 0 && !append) {
            document.getElementById('jobs-container').innerHTML =
                '<div class="state"><div class="emoji">🕐</div><p>No matches in database yet.<br>The scraper may still be running.</p></div>';
            return;
        }
        allJobs = append ? allJobs.concat(data) : data;
        currentOffset += data.length;
        updateCatCounts();
        renderJobs();
        var existing = document.getElementById('load-more-btn');
        if (existing) existing.remove();
        if (data.length === PAGE_SIZE) {
            var btn = document.createElement('div');
            btn.style.cssText = 'text-align:center;margin-top:24px;';
            btn.id = 'load-more-btn';
            btn.innerHTML = '<button onclick="fetchJobs(true)" style="padding:10px 28px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--muted2);font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer;">Load more jobs</button>';
            document.getElementById('jobs-container').appendChild(btn);
        }
    } catch (err) {
        console.error(err);
        document.getElementById('jobs-container').innerHTML =
            '<div class="state"><div class="emoji">⚠️</div><p style="color:var(--red)">Failed to load jobs.<br><small style="color:var(--muted)">' + err.message + '</small></p></div>';
    }
}

// ── Site Stats ─────────────────────────────────────────────────────────
async function loadSiteStats() {
    try {
        const res = await fetch('/.netlify/functions/getSiteStats');
        const { summary, sites } = await res.json();
        statsLoaded = true;

        const statusLabel = (site) => {
            if (site.success_rate === 0 && site.runs >= 2) return '<span class="status-pill pill-red">Failing</span>';
            if (site.total_quality_jobs === 0 && site.runs >= 2) return '<span class="status-pill pill-yellow">No Jobs</span>';
            return '<span class="status-pill pill-green">Active</span>';
        };

        const atsBadgeHtml = (name) => {
            if (!name) return '<span style="color:var(--muted)">—</span>';
            const cls = name.toLowerCase().includes('greenhouse') ? 'ats-greenhouse'
                      : name.toLowerCase().includes('lever')      ? 'ats-lever'
                      : name.toLowerCase().includes('ashby')      ? 'ats-ashby'
                      : name.toLowerCase().includes('workday')    ? 'ats-workday'
                      : 'ats-other';
            return `<span class="ats-badge ${cls}">${esc(name)}</span>`;
        };

        const html = `
        <div class="stats-summary">
            <div class="stat-box green"><div class="val">${summary.productive_sites}</div><div class="lbl">Productive Sites</div></div>
            <div class="stat-box red">  <div class="val">${summary.always_failing}</div><div class="lbl">Always Failing</div></div>
            <div class="stat-box yellow"><div class="val">${summary.always_no_jobs}</div><div class="lbl">No Jobs Found</div></div>
            <div class="stat-box blue"> <div class="val">${summary.total_sites_tracked}</div><div class="lbl">Total Tracked</div></div>
        </div>
        <table class="site-table">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Company</th>
                    <th>ATS</th>
                    <th>Runs</th>
                    <th>Seen</th>
                    <th>Saved</th>
                    <th>Avg ms</th>
                    <th>Last Error</th>
                </tr>
            </thead>
            <tbody>
                ${sites.map(s => `
                <tr>
                    <td>${statusLabel(s)}</td>
                    <td style="font-weight:600;color:var(--text)">${esc(s.company_name || s._id.split('/boards/')[1]?.split('/')[0] || s._id)}</td>
                    <td>${atsBadgeHtml(s.last_ats_name)}</td>
                    <td>${s.runs}</td>
                    <td style="color:var(--muted2)">${s.total_jobs_seen ?? '—'}</td>
                    <td style="color:var(--green);font-weight:600">${s.total_quality_jobs}</td>
                    <td>${Math.round(s.avg_fetch_time_ms)}ms</td>
                    <td style="font-size:0.7rem;color:var(--red);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                        title="${esc(s.last_error || '')}">${s.last_error ? esc(s.last_error.slice(0, 60)) + '…' : '—'}</td>
                </tr>`).join('')}
            </tbody>
        </table>`;

        document.getElementById('stats-container').innerHTML = html;
    } catch (err) {
        document.getElementById('stats-container').innerHTML =
            `<div class="state"><div class="emoji">⚠️</div><p style="color:var(--red)">Could not load site stats.<br>Run the scraper at least once first.</p></div>`;
    }
}

// ── Init ───────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() { fetchJobs(false); });
</script>
