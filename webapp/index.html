<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobBuddy — Daily Job Feed</title>
    <meta name="description"
        content="Personalized job matches scraped daily from 150+ company career pages, filtered for a CS fresher in Hyderabad.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #08080d;
            --surface: #0e0e16;
            --surface2: #14141e;
            --surface3: #1b1b28;
            --border: #1e1e2e;
            --border2: #28283c;
            --accent: #7c6af7;
            --accent2: #6254e0;
            --accent-glow: rgba(124, 106, 247, 0.16);
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.11);
            --yellow: #fbbf24;
            --yellow-dim: rgba(251, 191, 36, 0.10);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.10);
            --blue: #60a5fa;
            --blue-dim: rgba(96, 165, 250, 0.10);
            --text: #e4e4f0;
            --text2: #9898b8;
            --muted: #52527a;
            --muted2: #74748a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Kill Netlify badge no matter how it's injected */
        a[href*="netlify.com"][style*="fixed"],
        [data-netlify-deploy-id] {
            display: none !important;
        }

        /* ── HEADER ──────────────────────────────────────────────────── */
        .header {
            border-bottom: 1px solid var(--border);
            padding: 20px 32px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 13, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .header-inner {
            max-width: 1080px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            box-shadow: 0 0 16px rgba(124, 106, 247, 0.4);
            flex-shrink: 0;
        }

        .wordmark {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .wordmark span {
            color: var(--accent);
        }

        .header-sub {
            font-size: 0.69rem;
            color: var(--muted2);
            margin-top: 2px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .hstat {
            text-align: right;
        }

        .hstat-val {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .hstat-lbl {
            font-size: 0.62rem;
            color: var(--muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        /* ── NAV ─────────────────────────────────────────────────────── */
        .top-nav {
            display: flex;
        }

        .nav-btn {
            padding: 9px 18px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted2);
            font-size: 0.81rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            margin-bottom: -1px;
        }

        .nav-btn:hover {
            color: var(--text);
        }

        .nav-btn.active {
            color: var(--text);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        /* ── PANEL ───────────────────────────────────────────────────── */
        #panel-jobs {
            display: block;
        }

        #panel-stats {
            display: none;
        }

        .panel {
            max-width: 1080px;
            margin: 0 auto;
            padding: 18px 32px 100px;
        }

        /* ── CATEGORY TABS ───────────────────────────────────────────── */
        .cat-scroll-wrap {
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 14px 0 10px;
            border-bottom: 1px solid var(--border);
        }

        .cat-scroll-wrap::-webkit-scrollbar {
            display: none;
        }

        .cat-tabs {
            display: flex;
            gap: 4px;
            white-space: nowrap;
            min-width: max-content;
        }

        .cat-btn {
            padding: 5px 13px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 20px;
            color: var(--muted2);
            font-size: 0.76rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.14s;
            white-space: nowrap;
        }

        .cat-btn:hover {
            color: var(--text);
            background: var(--surface2);
        }

        .cat-btn.active {
            background: var(--accent-glow);
            border-color: rgba(124, 106, 247, 0.32);
            color: #c4b8ff;
            font-weight: 600;
        }

        .cat-btn .count {
            margin-left: 4px;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .cat-btn.active .count {
            color: rgba(196, 184, 255, 0.65);
        }

        /* ── FILTERS ─────────────────────────────────────────────────── */
        .filter-section {
            padding: 14px 0 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-wrap {
            position: relative;
            width: 100%;
        }

        .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.84rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .search-input:focus {
            border-color: rgba(124, 106, 247, 0.45);
            box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.08);
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .filter-pills-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .filter-group-label {
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--muted);
            margin-right: 1px;
            user-select: none;
        }

        .fdivider {
            width: 1px;
            height: 16px;
            background: var(--border2);
            margin: 0 4px;
            flex-shrink: 0;
            align-self: center;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 0.73rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--muted2);
            transition: all 0.14s;
            white-space: nowrap;
            line-height: 1;
        }

        .pill:hover {
            color: var(--text);
            background: var(--surface3);
        }

        .pill.p-safe {
            background: var(--green-dim);
            border-color: rgba(52, 211, 153, 0.32);
            color: var(--green);
            font-weight: 600;
        }

        .pill.p-possible {
            background: var(--yellow-dim);
            border-color: rgba(251, 191, 36, 0.32);
            color: var(--yellow);
            font-weight: 600;
        }

        .pill.p-all {
            background: var(--accent-glow);
            border-color: rgba(124, 106, 247, 0.32);
            color: #c4b8ff;
            font-weight: 600;
        }

        .pill.p-loc {
            background: var(--blue-dim);
            border-color: rgba(96, 165, 250, 0.32);
            color: var(--blue);
            font-weight: 600;
        }

        .mini-select {
            padding: 5px 10px;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 20px;
            color: var(--muted2);
            font-size: 0.73rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .mini-select option {
            background: var(--surface2);
        }

        /* ── RESULT META ─────────────────────────────────────────────── */
        .result-count {
            font-size: 0.72rem;
            color: var(--muted);
            padding: 10px 0 4px;
        }

        /* ── SECTION LABEL ───────────────────────────────────────────── */
        .section-label {
            font-size: 0.63rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 20px 0 8px;
        }

        /* ── JOB CARD ────────────────────────────────────────────────── */
        .job-card {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 14px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        .job-card:hover {
            background: rgba(124, 106, 247, 0.028);
            margin: 0 -14px;
            padding: 15px 14px;
            border-radius: 12px;
            border-bottom-color: transparent;
        }

        .job-card.blocked {
            opacity: 0.38;
        }

        .job-card.blocked:hover {
            opacity: 0.65;
        }

        .job-left {
            min-width: 0;
        }

        .job-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .job-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            flex-shrink: 1;
        }

        .tag-new {
            font-size: 0.57rem;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid rgba(124, 106, 247, 0.38);
            border-radius: 20px;
            padding: 1px 6px;
            flex-shrink: 0;
            animation: pnew 2.5s ease-in-out infinite;
        }

        @keyframes pnew {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .job-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        .job-company {
            font-size: 0.77rem;
            font-weight: 600;
            color: var(--text2);
        }

        .meta-sep {
            color: var(--border2);
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .job-loc {
            font-size: 0.73rem;
            color: var(--muted2);
        }

        .job-cat {
            font-size: 0.70rem;
            color: var(--muted);
        }

        .job-reason {
            font-size: 0.71rem;
            color: var(--muted2);
            line-height: 1.55;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
        }

        .job-reason.expanded {
            display: block;
            -webkit-line-clamp: unset;
        }

        .job-gaps {
            margin-top: 4px;
            font-size: 0.67rem;
            color: var(--muted);
            display: none;
        }

        .job-gaps.vis {
            display: block;
        }

        .expand-btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-top: 3px;
            font-size: 0.67rem;
            color: var(--muted);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.14s;
        }

        .expand-btn:hover {
            color: var(--text2);
        }

        /* RIGHT always visible */
        .job-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            padding-top: 1px;
        }

        .job-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
        }

        .apply-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 15px;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .apply-btn.direct-btn {
            background: linear-gradient(135deg, var(--accent), #9b8eff);
            color: #fff;
            box-shadow: 0 2px 10px rgba(124, 106, 247, 0.28);
        }

        .apply-btn.direct-btn:hover {
            box-shadow: 0 4px 18px rgba(124, 106, 247, 0.44);
            transform: translateY(-1px);
        }

        .apply-btn.browse-btn {
            background: var(--surface2);
            border: 1px solid var(--border2);
            color: var(--muted2);
        }

        .apply-btn.browse-btn:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        /* ── STATS ───────────────────────────────────────────────────── */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
        }

        .stat-box .val {
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -0.04em;
        }

        .stat-box .lbl {
            font-size: 0.71rem;
            color: var(--muted2);
        }

        .site-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.79rem;
        }

        .site-table th {
            text-align: left;
            font-size: 0.63rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
        }

        .site-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--muted2);
        }

        .site-table tr:last-child td {
            border-bottom: none;
        }

        .site-table tr:hover td {
            background: rgba(255, 255, 255, 0.010);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.69rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .pill-green {
            background: var(--green-dim);
            color: var(--green);
        }

        .pill-yellow {
            background: var(--yellow-dim);
            color: var(--yellow);
        }

        .pill-red {
            background: var(--red-dim);
            color: var(--red);
        }

        /* ── STATES ──────────────────────────────────────────────────── */
        .state {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .state p {
            color: var(--muted);
            font-size: 0.87rem;
        }

        /* ── MOBILE ──────────────────────────────────────────────────── */
        @media (max-width: 680px) {
            .header {
                padding: 14px 16px 0;
            }

            .panel {
                padding: 10px 16px 80px;
            }

            .header-stats {
                display: none;
            }

            .stats-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            /* Card: stack content on top, badges+button on bottom row */
            .job-card {
                flex-direction: column;
            }

            .job-left {
                width: 100%;
            }

            .job-right {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding-left: 0;
            }

            .job-badges {
                flex-wrap: nowrap;
            }
        }

        @media (max-width: 400px) {
            .job-title {
                white-space: normal;
            }

            .filter-group-label {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-inner">
            <div class="header-top">
                <div class="brand-block">
                    <div class="brand-icon">&#128188;</div>
                    <div>
                        <div class="wordmark">Job<span>Buddy</span></div>
                        <div class="header-sub">156+ career pages scraped daily &middot; CS fresher, Hyderabad</div>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="hstat">
                        <div class="hstat-val" id="stat-matches">&#8212;</div>
                        <div class="hstat-lbl">Matches</div>
                    </div>
                    <div class="hstat">
                        <div class="hstat-val" id="stat-direct">&#8212;</div>
                        <div class="hstat-lbl">Direct Apply</div>
                    </div>
                    <div class="hstat">
                        <div class="hstat-val" id="stat-new">&#8212;</div>
                        <div class="hstat-lbl">Last 48h</div>
                    </div>
                </div>
            </div>
            <div class="top-nav">
                <button class="nav-btn active" onclick="switchPanel('jobs',this)">Jobs</button>
                <button class="nav-btn" onclick="switchPanel('stats',this)">Site Analysis</button>
            </div>
        </div>
    </div>

    <!-- JOBS PANEL -->
    <div id="panel-jobs" class="panel">
        <!-- Category tabs -->
        <div class="cat-scroll-wrap">
            <div class="cat-tabs" id="cat-tabs">
                <button class="cat-btn active" data-cat="all" onclick="setCat('all',this)">All</button>
                <button class="cat-btn" data-cat="software_engineering"
                    onclick="setCat('software_engineering',this)">Software Eng</button>
                <button class="cat-btn" data-cat="data_ml" onclick="setCat('data_ml',this)">Data / ML</button>
                <button class="cat-btn" data-cat="devops_cloud" onclick="setCat('devops_cloud',this)">DevOps</button>
                <button class="cat-btn" data-cat="cybersecurity"
                    onclick="setCat('cybersecurity',this)">Security</button>
                <button class="cat-btn" data-cat="early_careers" onclick="setCat('early_careers',this)">Early
                    Careers</button>
                <button class="cat-btn" data-cat="product_design"
                    onclick="setCat('product_design',this)">Product</button>
                <button class="cat-btn" data-cat="other" onclick="setCat('other',this)">Other</button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="search-wrap">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input class="search-input" id="search-input" type="text"
                    placeholder="Search title, company, location&#8230;" oninput="renderJobs()">
            </div>

            <div class="filter-pills-row">
                <!-- Experience -->
                <span class="filter-group-label">Exp</span>
                <button class="pill p-safe" id="exp-safe" onclick="setExp('SAFE',this)">&#10003; Safe</button>
                <button class="pill" id="exp-possible" onclick="setExp('POSSIBLE',this)">&#9888; Possible</button>
                <button class="pill" id="exp-all" onclick="setExp('all',this)">All</button>

                <div class="fdivider"></div>

                <!-- Location -->
                <span class="filter-group-label">Location</span>
                <button class="pill p-loc" id="loc-all" onclick="setLoc('all',this)">&#127757; All</button>
                <button class="pill" id="loc-remote" onclick="setLoc('remote',this)">&#127968; Remote</button>
                <button class="pill" id="loc-india" onclick="setLoc('india',this)">&#127470;&#127475; India</button>
                <button class="pill" id="loc-global" onclick="setLoc('global',this)">&#9992; Global</button>

                <div class="fdivider"></div>

                <select class="mini-select" id="quality-select" onchange="renderJobs()">
                    <option value="0">Any quality</option>
                    <option value="3" selected>Quality 3+</option>
                    <option value="4">Quality 4+</option>
                    <option value="5">Quality 5</option>
                </select>
                <select class="mini-select" id="type-select" onchange="renderJobs()">
                    <option value="all">All types</option>
                    <option value="direct_apply">Direct Apply</option>
                    <option value="filtered_list">Browse Lists</option>
                </select>
            </div>
        </div>

        <div class="result-count" id="result-count"></div>
        <div id="jobs-container">
            <div class="state">
                <div class="spinner"></div>
                <p>Loading job matches&#8230;</p>
            </div>
        </div>
    </div>

    <!-- STATS PANEL -->
    <div id="panel-stats" class="panel">
        <div id="stats-container">
            <div class="state">
                <div class="spinner"></div>
                <p>Loading site performance&#8230;</p>
            </div>
        </div>
    </div>

    <script>
        // State
        let allJobs = [];
        let activeCat = 'all';
        let activeExp = 'SAFE';
        let activeLoc = 'all';
        let statsLoaded = false;
        let cardIdx = 0;
        let isLoading = true;  // true until first real data is shown

        const CACHE_KEY = 'jb_jobs_v1';
        const CACHE_TTL = 10 * 60 * 1000; // 10 minutes

        // Location keywords
        const INDIA_WORDS = ['india', 'hyderabad', 'hyd', 'bangalore', 'bengaluru', 'mumbai', 'delhi', 'new delhi', 'gurugram', 'gurgaon', 'pune', 'chennai', 'noida', 'kolkata', 'ahmedabad', 'jaipur', 'kochi', 'coimbatore', 'navi mumbai', 'thane'];
        const REMOTE_WORDS = ['remote', 'work from home', 'wfh', 'anywhere', 'distributed', 'worldwide', 'global remote'];

        function locMatch(job) {
            const l = (job.location || '').toLowerCase();
            if (activeLoc === 'all') return true;
            if (activeLoc === 'remote') return REMOTE_WORDS.some(k => l.includes(k));
            if (activeLoc === 'india') return INDIA_WORDS.some(k => l.includes(k));
            if (activeLoc === 'global') {
                // global = not India-specific (but remote is ok)
                const isIndia = INDIA_WORDS.filter(k => k !== 'india').some(k => l.includes(k));
                return !isIndia;
            }
            return true;
        }

        // Panel
        function switchPanel(p, btn) {
            document.getElementById('panel-jobs').style.display = p === 'jobs' ? 'block' : 'none';
            document.getElementById('panel-stats').style.display = p === 'stats' ? 'block' : 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (p === 'stats' && !statsLoaded) loadSiteStats();
        }

        // Category
        function setCat(cat, btn) {
            activeCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderJobs();
        }

        // Exp filter
        function setExp(val, btn) {
            activeExp = val;
            ['exp-safe', 'exp-possible', 'exp-all'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = 'pill';
            });
            btn.className = val === 'SAFE' ? 'pill p-safe' : val === 'POSSIBLE' ? 'pill p-possible' : 'pill p-all';
            renderJobs();
        }

        // Loc filter
        function setLoc(val, btn) {
            activeLoc = val;
            ['loc-all', 'loc-remote', 'loc-india', 'loc-global'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = 'pill';
            });
            btn.className = 'pill p-loc';
            renderJobs();
        }

        // Helpers
        function isNew(d) { return d && (Date.now() - new Date(d).getTime()) < 48 * 3600 * 1000; }
        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function qOf(j) { return typeof j.quality === 'number' ? j.quality : 3; }
        function ltOf(j) { return j.link_type || 'direct_apply'; }

        // Render
        function renderJobs() {
            // Don't let filter clicks wipe the spinner during initial hard load
            if (isLoading && allJobs.length === 0) return;
            const q = (document.getElementById('search-input').value || '').toLowerCase();
            const minQ = parseInt(document.getElementById('quality-select').value, 10);
            const typeF = document.getElementById('type-select').value;

            const filtered = allJobs.filter(job => {
                if (activeCat !== 'all' && job.category !== activeCat) return false;
                if (qOf(job) < minQ) return false;
                if (typeF !== 'all' && ltOf(job) !== typeF) return false;
                const v = job.experience_verdict || null;
                if (activeExp === 'SAFE' && v !== 'SAFE') return false;
                if (activeExp === 'POSSIBLE' && v !== 'POSSIBLE') return false;
                if (!locMatch(job)) return false;
                if (q) {
                    const hay = [job.title, job.company_name, job.location, job.match_reasoning].join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            const vo = { SAFE: 0, POSSIBLE: 1, BLOCKED: 2 };
            filtered.sort((a, b) => {
                const va = vo[a.experience_verdict] ?? 1, vb = vo[b.experience_verdict] ?? 1;
                if (va !== vb) return va - vb;
                return (b.match_score ?? 0) - (a.match_score ?? 0);
            });

            document.getElementById('result-count').textContent =
                filtered.length + ' job' + (filtered.length !== 1 ? 's' : '') + ' match your filters';

            const cnt = document.getElementById('jobs-container');
            if (!filtered.length) {
                cnt.innerHTML = '<div class="state"><p style="font-size:1.4rem;margin-bottom:8px">&#128269;</p><p>No jobs match these filters.</p></div>';
                return;
            }
            cardIdx = 0;
            const direct = filtered.filter(j => ltOf(j) === 'direct_apply');
            const browsable = filtered.filter(j => ltOf(j) !== 'direct_apply');
            let html = '';
            if (direct.length) html += '<div class="section-label">Direct Apply &mdash; ' + direct.length + '</div>' + direct.map(buildCard).join('');
            if (browsable.length && typeF !== 'direct_apply')
                html += '<div class="section-label" style="margin-top:' + (direct.length ? '8px' : '0') + '">Browse Lists &mdash; ' + browsable.length + '</div>' + browsable.map(buildCard).join('');
            cnt.innerHTML = html;
        }

        // Card
        function buildCard(job) {
            const id = 'c' + (cardIdx++);
            const isDirect = ltOf(job) === 'direct_apply';
            const verdict = job.experience_verdict || null;
            const score = job.match_score != null ? job.match_score : null;
            const newTag = isNew(job.scraped_at) ? '<span class="tag-new">New</span>' : '';
            const reason = job.match_reasoning || job.match_reason || '';
            const gaps = (job.skill_gaps && job.skill_gaps.length) ? job.skill_gaps.join(', ') : '';
            const cat = (job.category || 'other').replace(/_/g, ' ');
            const isBlocked = verdict === 'BLOCKED';

            const vmap = { SAFE: ['verdict-safe', '&#10003; Safe'], POSSIBLE: ['verdict-possible', '&#9888; Possible'], BLOCKED: ['verdict-blocked', '&#128683; Blocked'] };
            const [vcls, vlbl] = vmap[verdict] || ['verdict-possible', verdict || ''];
            const vbadge = verdict ? '<span class="' + vcls + '">' + vlbl + '</span>' : '';
            const smap = score >= 70 ? 'score-high' : score >= 40 ? 'score-mid' : 'score-low';
            const sbadge = score != null ? '<span class="match-score ' + smap + '">' + score + '%</span>' : '';

            const initials = (job.company_name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
            const domain = (job.company_name || '').toLowerCase().replace(/\s+/g, '') + '.com';
            const avatar = '<div class="logo-avatar"><img src="https://logo.clearbit.com/' + esc(domain) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + initials + '\'"></div>';

            const reasonHtml = reason ?
                '<div class="job-reason" id="r' + id + '">' + esc(reason) + '</div>' +
                (gaps ? '<div class="job-gaps" id="g' + id + '"><span style="color:var(--yellow);margin-right:2px">&#9888;</span>Gaps: ' + esc(gaps) + '</div>' : '') +
                '<button class="expand-btn" id="b' + id + '" onclick="toggle(\'' + id + '\')">' +
                '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg> more</button>' : '';

            const applyBtn = isDirect
                ? '<a href="' + esc(job.link || '#') + '" class="apply-btn direct-btn" target="_blank" rel="noopener noreferrer">Apply &#8594;</a>'
                : '<a href="' + esc(job.link || '#') + '" class="apply-btn browse-btn" target="_blank" rel="noopener noreferrer">Browse &#8594;</a>';

            return '<div class="job-card' + (isBlocked ? ' blocked' : '') + '">' +
                '<div class="job-left">' +
                '<div class="job-title-row"><div class="job-title">' + esc(job.title || 'Untitled') + '</div>' + newTag + '</div>' +
                '<div class="job-meta">' +
                (job.company_name ? '<span class="job-company">' + esc(job.company_name) + '</span>' : '') +
                (job.company_name && job.location ? '<span class="meta-sep">/</span>' : '') +
                (job.location ? '<span class="job-loc">' + esc(job.location) + '</span>' : '') +
                (cat ? '<span class="meta-sep">&middot;</span><span class="job-cat">' + esc(cat) + '</span>' : '') +
                '</div>' +
                reasonHtml +
                '</div>' +
                '<div class="job-right">' +
                '<div class="job-badges">' + vbadge + sbadge + '</div>' +
                applyBtn +
                '</div>' +
                '</div>';
        }

        function toggle(id) {
            const r = document.getElementById('r' + id);
            const g = document.getElementById('g' + id);
            const b = document.getElementById('b' + id);
            if (!r) return;
            const ex = r.classList.toggle('expanded');
            if (g) g.classList.toggle('vis', ex);
            b.innerHTML = ex
                ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg> less'
                : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg> more';
        }

        // Cat counts
        function updateCounts() {
            const cats = ['software_engineering', 'data_ml', 'devops_cloud', 'cybersecurity', 'early_careers', 'product_design', 'other'];
            const ab = document.querySelector('[data-cat="all"]');
            if (ab) { let c = ab.querySelector('.count'); if (!c) { c = document.createElement('span'); c.className = 'count'; ab.appendChild(c); } c.textContent = allJobs.length; }
            cats.forEach(cat => {
                const btn = document.querySelector('[data-cat="' + cat + '"]');
                if (!btn) return;
                const n = allJobs.filter(j => j.category === cat).length;
                let c = btn.querySelector('.count'); if (!c) { c = document.createElement('span'); c.className = 'count'; btn.appendChild(c); }
                c.textContent = n;
            });
            document.getElementById('stat-matches').textContent = allJobs.length;
            document.getElementById('stat-direct').textContent = allJobs.filter(j => ltOf(j) === 'direct_apply').length;
            document.getElementById('stat-new').textContent = allJobs.filter(j => isNew(j.scraped_at)).length;
        }

        // Cache helpers
        function saveCache(jobs) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), jobs })); } catch (e) { }
        }
        function loadCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const { ts, jobs } = JSON.parse(raw);
                if (Date.now() - ts > CACHE_TTL) return null; // expired
                return jobs;
            } catch (e) { return null; }
        }

        // Sync indicator in header
        function setSyncing(on) {
            let dot = document.getElementById('sync-dot');
            if (on && !dot) {
                dot = document.createElement('span');
                dot.id = 'sync-dot';
                dot.title = 'Refreshing from server\u2026';
                dot.style.cssText = 'display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle;animation:pnew 1.2s ease-in-out infinite;';
                const sub = document.querySelector('.header-sub');
                if (sub) sub.appendChild(dot);
            } else if (!on && dot) {
                dot.remove();
            }
        }

        // Fetch
        let offset = 0;
        const PAGE = 200;
        async function fetchJobs(append) {
            append = !!append;
            cardIdx = 0;

            if (!append) {
                offset = 0;
                // Try cache first — show instantly, no spinner
                const cached = loadCache();
                if (cached && cached.length) {
                    allJobs = cached;
                    isLoading = false;
                    updateCounts();
                    renderJobs();
                    setSyncing(true); // show subtle dot while refreshing
                } else {
                    isLoading = true;
                    document.getElementById('jobs-container').innerHTML =
                        '<div class="state"><div class="spinner"></div><p>Fetching your job matches&#8230;</p></div>';
                }
            }

            try {
                const res = await fetch('/.netlify/functions/getJobs?min_quality=0&limit=' + PAGE + '&skip=' + offset);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error(data.error || 'Bad response from server');
                if (!data.length && !append) {
                    setSyncing(false);
                    if (allJobs.length === 0) {
                        document.getElementById('jobs-container').innerHTML =
                            '<div class="state"><p style="font-size:1.4rem;margin-bottom:8px">&#128336;</p><p>No matches yet. Scraper may still be running.</p></div>';
                    }
                    return;
                }
                allJobs = append ? allJobs.concat(data) : data;
                offset += data.length;
                isLoading = false;
                if (!append) saveCache(allJobs);
                setSyncing(false);
                updateCounts();
                renderJobs();
                const ex = document.getElementById('lmb'); if (ex) ex.remove();
                if (data.length === PAGE) {
                    const d = document.createElement('div');
                    d.style.cssText = 'text-align:center;margin-top:28px;'; d.id = 'lmb';
                    d.innerHTML = '<button onclick="fetchJobs(true)" style="padding:9px 26px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;color:var(--muted2);font-family:inherit;font-size:0.8rem;font-weight:600;cursor:pointer;">Load more jobs</button>';
                    document.getElementById('jobs-container').appendChild(d);
                }
            } catch (e) {
                setSyncing(false);
                isLoading = false;
                const msg = e.message || 'Unknown error';
                if (allJobs.length === 0) {
                    document.getElementById('jobs-container').innerHTML =
                        '<div class="state">' +
                        '<p style="font-size:1.4rem;margin-bottom:10px">&#9888;</p>' +
                        '<p style="color:var(--red);margin-bottom:14px">' + msg + '</p>' +
                        '<button onclick="fetchJobs(false)" style="padding:8px 22px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:inherit;font-size:0.82rem;font-weight:600;cursor:pointer;">&#8635; Retry</button>' +
                        '</div>';
                }
            }
        }

        // Stats
        async function loadSiteStats() {
            try {
                const res = await fetch('/.netlify/functions/getSiteStats');
                const { summary, sites } = await res.json();
                statsLoaded = true;
                const sl = s => s.success_rate === 0 && s.runs >= 2 ? '<span class="status-pill pill-red">Failing</span>' : s.total_quality_jobs === 0 && s.runs >= 2 ? '<span class="status-pill pill-yellow">No Jobs</span>' : '<span class="status-pill pill-green">Active</span>';
                document.getElementById('stats-container').innerHTML =
                    '<div class="stats-summary">' +
                    '<div class="stat-box"><div class="val">' + summary.productive_sites + '</div><div class="lbl">Productive Sites</div></div>' +
                    '<div class="stat-box"><div class="val">' + summary.always_failing + '</div><div class="lbl">Always Failing</div></div>' +
                    '<div class="stat-box"><div class="val">' + summary.always_no_jobs + '</div><div class="lbl">No Jobs Found</div></div>' +
                    '<div class="stat-box"><div class="val">' + summary.total_sites_tracked + '</div><div class="lbl">Total Tracked</div></div>' +
                    '</div>' +
                    '<table class="site-table"><thead><tr><th>Status</th><th>Company</th><th>ATS</th><th>Runs</th><th>Seen</th><th>Saved</th><th>Avg ms</th><th>Last Error</th></tr></thead><tbody>' +
                    sites.map(s => '<tr><td>' + sl(s) + '</td><td style="font-weight:600;color:var(--text)">' + esc(s.company_name || s._id.split('/boards/')[1]?.split('/')[0]||s._id)+'</td ><td><span style="font-size:0.7rem;color:var(--muted2)">'+esc(s.last_ats_name||'&#8212;')+'</span></td><td>'+s.runs+'</td><td style="color:var(--muted2)">'+( s.total_jobs_seen??'&#8212;')+'</td><td style="color:var(--green);font-weight:600">'+s.total_quality_jobs+'</td><td>'+Math.round(s.avg_fetch_time_ms)+'ms</td><td style="font-size:0.67rem;color:var(--red);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(s.last_error||'')+'">'+( s.last_error?esc(s.last_error.slice(0,55))+'&#8230;':'&#8212;')+'</td></tr > ').join('')+
            '</tbody></table>';
            } catch (e) {
                document.getElementById('stats-container').innerHTML = '<div class="state"><p style="font-size:1.4rem;margin-bottom:8px">&#9888;</p><p style="color:var(--red)">Could not load stats.</p></div>';
            }
        }

        // Hide Netlify badge
        function hideNBadge() {
            document.querySelectorAll('a[href*="netlify.com"]').forEach(el => {
                if (getComputedStyle(el).position === 'fixed') el.style.setProperty('display', 'none', 'important');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchJobs(false);
            setTimeout(hideNBadge, 600);
            setTimeout(hideNBadge, 2000);
            setTimeout(hideNBadge, 5000);
        });
    </script>
</body>

</html>
